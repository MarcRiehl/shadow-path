<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow-Path</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/style-ui.css">
    <link rel="stylesheet" href="./styles/modal.css">
    <link rel="stylesheet" href="./styles/mobil-control.css">

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/zombie.class.js"></script>
    <script src="./models/crusader.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/coin-bar.class.js"></script>
    <script src="./models/endboss-bar.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/magic-bar.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/mobil-control.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/collectible-coins.class.js"></script>
    <script src="./models/collectible-magic.class.js"></script>
    <script src="./models/audio-manager-class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/template.js"></script>

    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link rel="shortcut icon" href="./favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Shadow-Path" />
    <link rel="manifest" href="./favicon/site.webmanifest" />

</head>

<body onload="loadGame()">
    <section class="wrapper-content">
        <section class="wrapper-inner">
            <!-- #region Content -->
            <section id="mobil-select">
                <div class="wrapper-mobil">
                    <div class="image-mobil"></div>
                    <h2 class="mobil-h2">Rotate to play!</h2>
                </div>
            </section>
            <div id="canvas-wrapper" class="canvas-wrapper">
                <canvas id="canvas" width="720" height="480">
                </canvas>
                <section id="mobil-control" class="d-none">
                    <div class="mobil-control-left">
                        <button id="leftBtn"></button>
                        <button id="rightBtn"></button>
                    </div>
                    <div class="mobil-control-right">
                        <button id="spaceBtn"></button>
                        <button id="dBtn"></button>
                    </div>
                </section>
                <div id="screen-overlay">
                    <div id="sound-control" class="sound-control">
                    </div>
                    <div id="start-screen">
                    </div>
                    <div id="bottom-menu" class="bottom-menu">
                    </div>
                    <div id="end-screen" class="d-none">
                    </div>
                    <div id="win-screen" class="d-none">
                    </div>
                    <div id="instructions" class="d-none modal">
                    </div>
                    <div id="impressum" class="d-none modal">
                    </div>
                </div>
            </div>
            <!-- #endregion -->
        </section>
    </section>
</body>
</html>
